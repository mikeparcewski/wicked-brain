name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write
  pull-requests: write

jobs:
  release:
    uses: mikeparcewski/wicked-ci/.github/workflows/node-release.yml@d8c9b0a14fb91c2d13f5da0468eeeff983c27e5a # v1.1.2
    with:
      package_name: wicked-brain
      test_working_dir: server
      version_dirs: |
        .
        server
      pre_publish_install_dirs: |
        .
        server
      enable_sync_pr: true
    secrets: inherit
